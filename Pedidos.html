<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div>
        <a href ="#pedidos">Pedidos</a>
    </div>
    
         <div id="pedidos">
        <h2>Realizar Pedido</h2>

        <form>
            <label>Nombre:</label>
            <input type="text">
            <br><br>

            <label>Correo electronico</label>
            <input type="email">
            <br><br>

            <label>Producto</label>
            <select>
                <option>Arroz</option>
                <option>Leche</option>
                <option>Aceite</option>
                <option>Café</option>
                <option>Pan</option>
                <option>Agua Pura</option>
                <option>Mermelada de fresa</option>
                <option>Caja de fresas</option>
                <option>Caja de uvas</option>
                <option>Helado Dulce de Leche</option>
            </select>
            <br><br>
            <label>Cantidad</label>
            <input type="number">
            <br><br>
            <input type="submit" value="Enviar Pedido">
        </form>

       </div>

    
    
</body>
</html>
